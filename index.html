<style>
:root{color-scheme:light;--bg:#f3f3f1;--sf:#fff;--sf2:#e9e9e6;--tx:#161616;--mu:#6f6f6f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{color-scheme:dark;--bg:#121212;--sf:#1e1e1e;--sf2:#2c2c2c;--tx:#f2f2f2;--mu:#a0a0a0;--on:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.35fr 1fr;gap:28px;padding:20px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px}}
.player{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{position:relative;width:100%;aspect-ratio:1.9;container-type:inline-size}
.cover{position:absolute;left:2cqw;top:50%;transform:translateY(-50%);height:46cqw;aspect-ratio:1;border-radius:1.2cqw;background:var(--sf2) center/cover;box-shadow:0 1.5cqw 4cqw #0003;display:grid;place-items:center;cursor:pointer;color:var(--mu)}
.vwrap{position:absolute;right:6cqw;top:50%;transform:translateY(-50%);width:50cqw;aspect-ratio:1}
.disc{width:100%;height:100%;border-radius:50%;position:relative;background:conic-gradient(#0000 0 8%,#fff1 12%,#0000 18% 58%,#fff1 62%,#0000 68%),repeating-radial-gradient(circle,var(--v1,#0b0b0b) 0 .25cqw,var(--v2,#1a1a1a) .3cqw .5cqw);box-shadow:0 1.5cqw 4cqw #0007;animation:spin 3.2s linear infinite;animation-play-state:paused}
.playing .disc{animation-play-state:running}

.label{position:absolute;inset:32%;border-radius:50%;background:var(--lc,#c8a27a);container-type:inline-size;overflow:hidden;color:var(--lx,#fff)}
.label::after{content:"";position:absolute;left:47%;top:47%;width:6%;aspect-ratio:1;border-radius:50%;background:#222;box-shadow:inset 0 0 0 .6cqw #0004}
.lt{position:absolute;inset:0;padding:20cqw 0 0 16cqw;transform:rotate(-90deg);text-align:left}
.lt b,.lt span{display:block;width:68cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt b{font-size:11cqw}.lt span{font-size:8.5cqw;opacity:.85}
.armbase{position:absolute;right:1cqw;top:5cqw;width:9cqw;aspect-ratio:1;border-radius:50%;background:#fafafa;box-shadow:0 .6cqw 2cqw #0003}
.arm{position:absolute;left:50%;top:50%;width:1.1cqw;height:31cqw;margin-left:-.55cqw;background:linear-gradient(90deg,#fff,#cfcfcf);border-radius:1cqw;transform-origin:50% 0;transform:rotate(-12deg);transition:transform .8s;box-shadow:.3cqw .5cqw 1cqw #0004}
.arm::before{content:"";position:absolute;top:-2.2cqw;left:-1.6cqw;width:4.4cqw;height:4.4cqw;background:#fff;border-radius:.8cqw;box-shadow:0 .3cqw 1cqw #0003}
.arm::after{content:"";position:absolute;bottom:-3cqw;left:-1.2cqw;width:3.4cqw;height:4.4cqw;background:#fff;border-radius:.4cqw;transform:rotate(-20deg);transform-origin:top;box-shadow:0 .3cqw 1cqw #0003}
.playing .arm{transform:rotate(20deg)}
.info{text-align:center;width:100%;display:flex;gap:8px;align-items:center;justify-content:center}
.info div{min-width:0;max-width:80%}
.info b,.info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{font-size:1.2rem}.info span{color:var(--mu);font-size:.95rem}
.seek{display:flex;gap:8px;align-items:center;width:min(100%,520px);font-size:.8rem;color:var(--mu)}
input[type=range]{flex:1;accent-color:var(--tx);height:28px}
.ctl{display:flex;gap:12px;align-items:center}
button{font:inherit;color:var(--tx);background:none;border:0;cursor:pointer}
.ib{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sf2)}
.ib.on{background:var(--tx);color:var(--on)}
.ib.one::after{content:"1";position:absolute;font-size:.6rem;font-weight:800;top:50%;left:50%;transform:translate(-50%,-45%)}
.play{width:68px;height:68px;background:var(--tx);color:var(--on)}
.vol{display:flex;gap:6px;align-items:center;width:min(60vw,240px);color:var(--mu)}
.lib{background:var(--sf);border-radius:18px;padding:14px;box-shadow:0 4px 20px #0001;display:flex;flex-direction:column;min-height:300px;max-height:calc(100vh - 40px)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:20px;background:var(--sf2);font-size:.9rem}
.chip.on{background:var(--tx);color:var(--on)}
.add{display:flex;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:12px;border:2px dashed var(--mu);margin-bottom:10px;color:var(--mu)}
.list{overflow-y:auto;flex:1}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.row.cur{background:var(--sf2)}

.row .t span{color:var(--mu);font-size:.82rem}
.th{width:44px;height:44px;border-radius:8px;background:var(--sf2) center/cover;flex:none;display:grid;place-items:center;color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
dialog{background:var(--sf);color:var(--tx);border:0;border-radius:16px;padding:16px;width:min(92vw,340px)}

dialog label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:8px}

.mi{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}
.mi:hover{background:var(--sf2)}
.cv{display:flex;gap:8px;align-items:center;margin:8px 0}
.b{padding:10px 14px;border-radius:10px;background:var(--sf2)}
.pri{background:var(--tx);color:var(--on)}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

.app{grid-template-columns:1fr;max-width:760px;margin:0 auto}
.home{max-width:1100px;margin:0 auto;padding:20px 16px 110px}
.hh{display:flex;justify-content:space-between;align-items:center;gap:10px}

.card{position:relative;cursor:pointer}

.cm,.x{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:#000b;color:#fff;display:grid;place-items:center}
.top{align-self:flex-start}
.qs{width:100%}
.q{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.qc{position:relative;flex:none;width:112px;cursor:pointer}
.qc .th{width:112px;height:112px;border-radius:10px}

.x{width:28px;height:28px;top:4px;right:4px}
.mini{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);box-shadow:0 -4px 20px #0002;display:flex;gap:10px;align-items:center;z-index:5}
.mini .m1{flex:1;min-width:0;display:flex;gap:10px;align-items:center;cursor:pointer}
.mini .m1 div:last-child{min-width:0}
.label.cov{background-size:cover;background-position:center}
.dh{display:flex;gap:16px;align-items:flex-end;margin:16px 0}.dc{width:min(44vw,240px);flex:none}
.cc{position:relative}
.di{min-width:0}.di h1{margin:0 0 4px;font-size:1.5rem}.di>span{color:var(--mu)}.di .cv{flex-wrap:wrap}
.pvd{width:120px;aspect-ratio:1;border-radius:50%;margin:0 auto 12px;position:relative;background:repeating-radial-gradient(circle,var(--v1) 0 2px,var(--v2) 3px 4px)}

.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw button.on{border-color:var(--tx)}
body.tint{background:transparent}
body{overflow-x:hidden}
.app{grid-template-columns:minmax(0,1fr)}
.app>*,.player>*{min-width:0}
dialog{max-height:88vh;overflow-y:auto}
@media(max-width:600px){
.home{padding:16px 12px 110px}
.hh{flex-wrap:wrap}.hh h1{font-size:1.5rem}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dh{flex-direction:column;align-items:center;text-align:center}
.dc{width:min(72vw,280px)}
.di .cv{justify-content:center}
.ctl{gap:8px}.ib{width:42px;height:42px}.play{width:60px;height:60px}
.app{padding:8px}
}

 if(i<qi)qi--;else if(i===qi){const was=!au.paused;if(queue.length){qi=Math.min(qi,queue.length-1);load(was)}else{qi=-1;au.pause();au.removeAttribute('src');reset()}}
 refresh()}
function reorder(){if(qi<0)return;const cur=queue[qi],ok=x=>!removed.has(x)&&byId(x);
 if(shuffle){const rest=orig.filter(x=>x!==cur&&ok(x));
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}
  queue=[cur,...rest];qi=0}
 else{const all=orig.filter(ok);queue=all.includes(cur)?all:[cur,...all];qi=queue.indexOf(cur)}}
function menu(t,lite){
 const rm=lists.filter(l=>l.ids.includes(t.id)).map(l=>['Quitar de '+l.name,async()=>{l.ids=l.ids.filter(x=>x!==t.id);await put('lists',l)}]);
 dmenu([...(lite?[]:[['Editar información y portada',()=>edit(t)],['Personalizar vinilo del disco',()=>custom(t.album||'Sin álbum')],['Personalizar vinilo de esta canción',()=>custom('t:'+t.id,t)]]),
  ['Nueva playlist con esta canción',async()=>{const n=prompt('Nombre de la playlist');if(n&&n.trim()){await put('lists',{name:n.trim(),ids:[t.id]});lists=await all('lists')}}],
  ...lists.filter(l=>!l.ids.includes(t.id)).map(l=>['Añadir a '+l.name,async()=>{l.ids.push(t.id);await put('lists',l)}]),...rm,
  ...(lite?[]:[['Eliminar canción',async()=>{if(!confirm('¿Eliminar esta canción?'))return;await del('tracks',t.id);for(const l of lists){l.ids=l.ids.filter(x=>x!==t.id);await put('lists',l)}tracks=tracks.filter(x=>x.id!==t.id);drop(t.id)}]])])}
function edit(t){
 const d=$('#dlg');let nc;
 d.innerHTML='<h3>Editar información</h3><label>Título<input id="e1"></label><label>Artista<input id="e2"></label><label>Álbum<input id="e3"></label><div class="cv"><div class="th" id="e4" style="width:64px;height:64px"></div><button class="b" id="e5">Subir portada</button><button class="b" id="e6">Quitar</button></div><input type="file" id="e7" accept="image/*" hidden><div class="act"><button class="b" id="e8">Cancelar</button><button class="b pri" id="e9">Guardar</button></div>';
 const q=s=>d.querySelector(s);
 q('#e1').value=t.title;q('#e2').value=t.artist||'';q('#e3').value=t.album||'';
 const pv=b=>{const e=q('#e4');if(b){e.style.backgroundImage=`url(${URL.createObjectURL(b)})`;e.innerHTML=''}else{e.style.backgroundImage='';e.innerHTML=ic('note',24)}};
 pv(covB(t));
 q('#e5').onclick=()=>q('#e7').click();
 q('#e7').onchange=e=>{if(e.target.files[0]){nc=e.target.files[0];pv(nc)}};
 q('#e6').onclick=()=>{nc=null;pv(null)};
 q('#e8').onclick=()=>d.close();
 q('#e9').onclick=async()=>{
  t.title=q('#e1').value.trim()||t.title;t.artist=q('#e2').value.trim();t.album=q('#e3').value.trim();
  if(nc!==undefined){if(urls['c'+t.id])URL.revokeObjectURL(urls['c'+t.id]);delete urls['c'+t.id];t.cover=nc;t.ucov=nc?1:0;delete t.color;delete t.auto}
  await put('tracks',t);d.close();refresh();if(queue[qi]===t.id)paint(t);
 };
 d.showModal();
}
function start(ids,i){removed=new Set();orig=ids.slice();queue=ids.slice();qi=i;reorder();load(true);go('pv')}
function load(play){
 const t=byId(queue[qi]);if(!t)return;
 au.src=tu(t);paint(t);if(play)au.play().catch(()=>{});refresh();
}
function step(d){
 if(!queue.length)return;
 {qi+=d;if(qi>=queue.length){if(repeat===1)qi=0;else{qi=queue.length-1;au.pause();return}}if(qi<0)qi=0}
 load(true);
}
$('#pp').onclick=()=>{if(!au.src)return tracks.length&&start(tracks.map(t=>t.id),0);au.paused?au.play():au.pause()};
$('#next').onclick=()=>step(1);
$('#prev').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle);reorder();renderQ()};
$('#rep').onclick=e=>{repeat=(repeat+1)%3;const b=e.currentTarget;b.classList.toggle('on',repeat>0);b.classList.toggle('one',repeat===2)};
$('#mre').onclick=()=>{const t=byId(queue[qi]);if(t)menu(t,true)};
$('#back').innerHTML=ic('back',16)+'Inicio';$('#back').onclick=()=>go('home');
au.addEventListener('play',renderMini);au.addEventListener('pause',renderMini);
au.onplay=()=>{$('#pl').classList.add('playing');$('#pp').innerHTML=ic('pause',32)};
au.onpause=()=>{$('#pl').classList.remove('playing');$('#pp').innerHTML=ic('play',32)};
$('#pp').innerHTML=ic('play',32);
au.onended=()=>{if(repeat===2){au.currentTime=0;au.play()}else step(1)};
let seeking=false;const sk=$('#seek');
au.ontimeupdate=()=>{$('#cur').textContent=fmt(au.currentTime);if(au.duration&&!seeking)sk.value=au.currentTime/au.duration*1000};
au.onloadedmetadata=()=>$('#dur').textContent=fmt(au.duration);
sk.oninput=()=>{seeking=true;if(au.duration)au.currentTime=sk.value/1000*au.duration};
sk.onchange=()=>seeking=false;
$('#vol').oninput=e=>au.volume=e.target.value;
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('previoustrack',()=>step(-1))}
if(location.hostname.endsWith('github.io')){$('#syncb').hidden=false;$('#syncb').onclick=syncGH}
$('#addb').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
 const b=$('#addb'),fs=[...e.target.files];
 for(let i=0;i<fs.length;i++){
  b.textContent=`Procesando ${i+1}/${fs.length}…`;
  const m=await meta(fs[i]);
  const rec={title:m.title,artist:m.artist,album:m.album,cover:m.cover,blob:fs[i],name:fs[i].name};
  rec.id=await put('tracks',rec);if(rec.id==null){alert('No se pudo guardar: '+(window._ierr||'error'));continue}tracks.push(rec);
 }
 b.innerHTML=ic('plus',20)+'Cargar archivos de música';e.target.value='';refresh();
};
(async()=>{
 try{db=await open();tracks=await all('tracks');lists=await all('lists');(await all('albums')).forEach(a=>aset[a.name]=a);if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
 catch(e){$('#homebody').innerHTML='<div class="empty">Tu navegador no permite almacenamiento local.</div>'}
 $('#cover').innerHTML=ic('note',72);go('home');refresh();fillCovers();
})();
</script>
<script>if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
