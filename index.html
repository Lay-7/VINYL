<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Vinyl Player</title>

<meta name="theme-color" content="#f3f3f1">
<style>
:root{color-scheme:light;--bg:#f3f3f1;--sf:#fff;--sf2:#e9e9e6;--tx:#161616;--mu:#6f6f6f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121212;--sf:#1e1e1e;--sf2:#2c2c2c;--tx:#f2f2f2;--mu:#a0a0a0;--on:#111}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121212;--sf:#1e1e1e;--sf2:#2c2c2c;--tx:#f2f2f2;--mu:#a0a0a0;--on:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.35fr 1fr;gap:28px;padding:20px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px}}
.player{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{position:relative;width:100%;aspect-ratio:1.9;container-type:inline-size}
.cover{position:absolute;left:2cqw;top:50%;transform:translateY(-50%);height:46cqw;aspect-ratio:1;border-radius:1.2cqw;background:var(--sf2) center/cover;box-shadow:0 1.5cqw 4cqw #0003;display:grid;place-items:center;cursor:pointer;color:var(--mu)}
.vwrap{position:absolute;right:6cqw;top:50%;transform:translateY(-50%);width:50cqw;aspect-ratio:1}
.disc{width:100%;height:100%;border-radius:50%;position:relative;background:conic-gradient(#0000 0 8%,#fff1 12%,#0000 18% 58%,#fff1 62%,#0000 68%),repeating-radial-gradient(circle,var(--v1,#0b0b0b) 0 .25cqw,var(--v2,#1a1a1a) .3cqw .5cqw);box-shadow:0 1.5cqw 4cqw #0007;animation:spin 3.2s linear infinite;animation-play-state:paused}
.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;inset:32%;border-radius:50%;background:var(--lc,#c8a27a);container-type:inline-size;overflow:hidden;color:var(--lx,#fff)}
.label::after{content:"";position:absolute;left:47%;top:47%;width:6%;aspect-ratio:1;border-radius:50%;background:#222;box-shadow:inset 0 0 0 .6cqw #0004}
.lt{position:absolute;inset:0;padding:20cqw 0 0 16cqw;transform:rotate(-90deg);text-align:left}
.lt b,.lt span{display:block;width:68cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt b{font-size:11cqw}.lt span{font-size:8.5cqw;opacity:.85}
.armbase{position:absolute;right:1cqw;top:5cqw;width:9cqw;aspect-ratio:1;border-radius:50%;background:#fafafa;box-shadow:0 .6cqw 2cqw #0003}
.arm{position:absolute;left:50%;top:50%;width:1.1cqw;height:31cqw;margin-left:-.55cqw;background:linear-gradient(90deg,#fff,#cfcfcf);border-radius:1cqw;transform-origin:50% 0;transform:rotate(-12deg);transition:transform .8s;box-shadow:.3cqw .5cqw 1cqw #0004}
.arm::before{content:"";position:absolute;top:-2.2cqw;left:-1.6cqw;width:4.4cqw;height:4.4cqw;background:#fff;border-radius:.8cqw;box-shadow:0 .3cqw 1cqw #0003}
.arm::after{content:"";position:absolute;bottom:-3cqw;left:-1.2cqw;width:3.4cqw;height:4.4cqw;background:#fff;border-radius:.4cqw;transform:rotate(-20deg);transform-origin:top;box-shadow:0 .3cqw 1cqw #0003}
.playing .arm{transform:rotate(20deg)}
.info{text-align:center;width:100%;display:flex;gap:8px;align-items:center;justify-content:center}
.info div{min-width:0;max-width:80%}
.info b,.info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{font-size:1.2rem}.info span{color:var(--mu);font-size:.95rem}
.seek{display:flex;gap:8px;align-items:center;width:min(100%,520px);font-size:.8rem;color:var(--mu)}
input[type=range]{flex:1;accent-color:var(--tx);height:28px}
.ctl{display:flex;gap:12px;align-items:center}
button{font:inherit;color:var(--tx);background:none;border:0;cursor:pointer}
.ib{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sf2)}
.ib.on{background:var(--tx);color:var(--on)}
.ib.one::after{content:"1";position:absolute;font-size:.6rem;font-weight:800;top:50%;left:50%;transform:translate(-50%,-45%)}
.play{width:68px;height:68px;background:var(--tx);color:var(--on)}
.vol{display:flex;gap:6px;align-items:center;width:min(60vw,240px);color:var(--mu)}
.lib{background:var(--sf);border-radius:18px;padding:14px;box-shadow:0 4px 20px #0001;display:flex;flex-direction:column;min-height:300px;max-height:calc(100vh - 40px)}
@media(max-width:900px){.lib{max-height:none}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:20px;background:var(--sf2);font-size:.9rem}
.chip.on{background:var(--tx);color:var(--on)}
.add{display:flex;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:12px;border:2px dashed var(--mu);margin-bottom:10px;color:var(--mu)}
.list{overflow-y:auto;flex:1}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.row.cur{background:var(--sf2)}
.row .t{flex:1;min-width:0;cursor:pointer}
.row .t b,.row .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{color:var(--mu);font-size:.82rem}
.th{width:44px;height:44px;border-radius:8px;background:var(--sf2) center/cover;flex:none;display:grid;place-items:center;color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
dialog{background:var(--sf);color:var(--tx);border:0;border-radius:16px;padding:16px;width:min(92vw,340px)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 10px}
dialog label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:8px}
dialog input:not([type=file]){display:block;width:100%;margin-top:3px;padding:10px;border-radius:8px;border:1px solid var(--sf2);background:var(--bg);color:var(--tx);font:inherit;font-size:1rem}
.mi{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}
.mi:hover{background:var(--sf2)}
.cv{display:flex;gap:8px;align-items:center;margin:8px 0}
.b{padding:10px 14px;border-radius:10px;background:var(--sf2)}
.pri{background:var(--tx);color:var(--on)}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
[hidden]{display:none!important}
.app{grid-template-columns:1fr;max-width:760px;margin:0 auto}
.home{max-width:1100px;margin:0 auto;padding:20px 16px 110px}
.hh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hh h1{margin:0;font-size:1.8rem}
.sh{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.sh h2{margin:0;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{position:relative;cursor:pointer}
.cc{aspect-ratio:1;border-radius:12px;background:var(--sf2) center/cover;box-shadow:0 6px 18px #0002;display:grid;place-items:center;color:var(--mu);overflow:hidden}
.cc.m{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:stretch}
.cc.m div{background:center/cover;min-height:0;min-width:0}
.card b,.card span,.qc b,.qc span,.mini b,.mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{margin-top:8px}.card span,.qc span,.mini span{color:var(--mu);font-size:.82rem}
.cm,.x{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:#000b;color:#fff;display:grid;place-items:center}
.top{align-self:flex-start}
.qs{width:100%}
.q{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.qc{position:relative;flex:none;width:112px;cursor:pointer}
.qc .th{width:112px;height:112px;border-radius:10px}
.qc b{font-size:.85rem;margin-top:6px}
.x{width:28px;height:28px;top:4px;right:4px}
.mini{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);box-shadow:0 -4px 20px #0002;display:flex;gap:10px;align-items:center;z-index:5}
.mini .m1{flex:1;min-width:0;display:flex;gap:10px;align-items:center;cursor:pointer}
.mini .m1 div:last-child{min-width:0}
.label.cov{background-size:cover;background-position:center}
.dh{display:flex;gap:16px;align-items:flex-end;margin:16px 0}.dc{width:min(44vw,240px);flex:none}
.cc{position:relative}
.di{min-width:0}.di h1{margin:0 0 4px;font-size:1.5rem}.di>span{color:var(--mu)}.di .cv{flex-wrap:wrap}
.pvd{width:120px;aspect-ratio:1;border-radius:50%;margin:0 auto 12px;position:relative;background:repeating-radial-gradient(circle,var(--v1) 0 2px,var(--v2) 3px 4px)}
.pvd i{position:absolute;inset:32%;border-radius:50%;background:#888 center/cover}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw button.on{border-color:var(--tx)}
body.tint{background:transparent}
body{overflow-x:hidden}
.app{grid-template-columns:minmax(0,1fr)}
.app>*,.player>*{min-width:0}
dialog{max-height:88vh;overflow-y:auto}
@media(max-width:600px){
.home{padding:16px 12px 110px}
.hh{flex-wrap:wrap}.hh h1{font-size:1.5rem}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dh{flex-direction:column;align-items:center;text-align:center}
.dc{width:min(72vw,280px)}
.di .cv{justify-content:center}
.ctl{gap:8px}.ib{width:42px;height:42px}.play{width:60px;height:60px}
.app{padding:8px}
}
#pv{max-width:1100px;padding-bottom:80px}
.stage{width:min(100%,calc((100vh - 340px)*1.9));width:min(100%,calc((100dvh - 340px)*1.9))}
.qs{position:fixed;left:0;right:0;bottom:0;z-index:6;width:auto;background:var(--sf);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #0003;transform:translateY(calc(100% - 56px - env(safe-area-inset-bottom,0px)));transition:transform .3s;max-height:68vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.qs.open{transform:none}
.qh{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:56px;flex:none;cursor:pointer;font-weight:600}
.qh svg{transition:transform .3s}.qs.open .qh svg{transform:rotate(180deg)}
.q{display:block;overflow-x:hidden;overflow-y:auto;padding:0 8px 12px;gap:0}
.lyr{position:absolute;left:2cqw;width:42cqw;top:calc(50% + 23cqw);transform:translateY(-100%);padding:6cqw 2cqw 2cqw;border-radius:0 0 1.2cqw 1.2cqw;background:linear-gradient(#0000,#000b);color:#fff;text-align:center;pointer-events:none;font-size:max(11px,2.2cqw);line-height:1.35}
.lyr div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6}.lyr .on{opacity:1;font-weight:700;font-size:1.15em}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;font-size:.9rem;max-width:90vw;text-align:center}
dialog textarea{display:block;width:100%;margin-top:3px;padding:10px;border-radius:8px;border:1px solid var(--sf2);background:var(--bg);color:var(--tx);font:inherit;font-size:.9rem}
/* ===== v-final layout ===== */
:root{--rs:300px}
@media(pointer:fine){:root{--rs:340px}}
@media(pointer:coarse){.vol{display:none}}
#pv{padding:6px 12px;max-width:1200px}
.player{min-height:calc(100vh - 16px);min-height:calc(100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));justify-content:space-between;gap:10px}
.ptop{display:flex;align-items:center;gap:8px;width:100%}
.stage{--vs:50cqw;width:min(100%,calc((100vh - var(--rs))*1.9));width:min(100%,calc((100dvh - var(--rs))*1.9))}
.vwrap{width:var(--vs)}
.label{inset:23%}
.label::after{width:4%;left:48%;top:48%}
.armbase{right:auto;left:var(--vs);top:calc(var(--vs)*.165);width:calc(var(--vs)*.18);transform:translate(-50%,-50%)}
.arm{width:calc(var(--vs)*.022);height:calc(var(--vs)*.62);margin-left:calc(var(--vs)*-.011);border-radius:calc(var(--vs)*.02)}
.arm::before{top:calc(var(--vs)*-.044);left:calc(var(--vs)*-.032);width:calc(var(--vs)*.088);height:calc(var(--vs)*.088);border-radius:calc(var(--vs)*.016)}
.arm::after{bottom:calc(var(--vs)*-.06);left:calc(var(--vs)*-.024);width:calc(var(--vs)*.068);height:calc(var(--vs)*.088)}
.lyr{position:absolute;left:2cqw;width:44cqw;top:calc(50% + 23cqw);transform:translateY(-100%);height:17cqw;padding:0;overflow:hidden;border-radius:0 0 1.2cqw 1.2cqw;background:linear-gradient(#0000,#000b 55%);color:#fff;pointer-events:none;text-align:left;font-size:inherit;line-height:1}
.lyi{position:absolute;left:3cqw;right:3cqw;top:0;transition:transform .7s cubic-bezier(.22,.61,.36,1)}
.lyi div{padding:.3cqw 0;font-size:max(12px,2.1cqw);line-height:1.25;font-weight:700;white-space:normal;overflow:visible;opacity:0;transform:scale(.92);transform-origin:left center;transition:opacity .6s ease,transform .6s ease}
.lyi .nb{opacity:.45}.lyi .on{opacity:1;transform:scale(1)}
@media(orientation:portrait){
.stage{aspect-ratio:.85;--vs:70cqw;width:min(100%,calc((100vh - var(--rs))*.85));width:min(100%,calc((100dvh - var(--rs))*.85))}
.cover{left:3cqw;top:2cqw;transform:none;height:58cqw}
.vwrap{right:10cqw;top:auto;bottom:3cqw;transform:none}
.lyr{left:3cqw;width:58cqw;top:60cqw;height:24cqw}
.lyi div{font-size:max(12px,3.5cqw)}
}
#qbk{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
#qbk.open{opacity:1;pointer-events:auto}
.qs{transform:translateY(100%);max-height:72vh;width:auto;max-width:640px;margin:0 auto}
.qs.open{transform:none}
.qh{cursor:default}
.sty{display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;padding:6px 2px;border-radius:12px;font-size:.7rem;text-align:center;line-height:1.1}
.sty i{width:48px;height:48px;border-radius:50%;display:block}
.label.cov .lt{display:none}
.qs:not(.open){box-shadow:none;visibility:hidden;transition:transform .3s,visibility 0s .3s}
@media(orientation:portrait){
.stage{aspect-ratio:.75;width:min(100%,calc((100vh - var(--rs))*.75));width:min(100%,calc((100dvh - var(--rs))*.75))}
.lyr{height:22cqw}
}
dialog{width:min(92vw,400px)}
.pvd{width:140px}
/* ===== MD-style vinyl ===== */
.disc{background:none;overflow:hidden}
.dl{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.dfx{width:100%;height:100%}
.dgr{background:repeating-radial-gradient(circle,#0000 0 calc(var(--vs)*.005),#0003 calc(var(--vs)*.0055) calc(var(--vs)*.0095))}
.dgl{background:radial-gradient(circle closest-side,#0000 0 94%,#fff4 96%,#0008 98.5%,#000b 100%),conic-gradient(from 25deg,#0000 0,#fff5 7%,#0000 17%,#0000 50%,#fff4 57%,#0000 67%),radial-gradient(circle closest-side,#0000 0 40%,#0007 40.4% 41%,#0000 41.5% 58%,#0006 58.4% 59%,#0000 59.5% 74%,#0006 74.4% 75%,#0000 75.5% 88%,#0006 88.4% 89%,#0000 89.5%),radial-gradient(circle closest-side,#fff0 0 41%,#fff1 41% 59%,#fff0 59% 75%,#fff1 75% 89%,#fff0 89%)}
.ti{position:relative;overflow:hidden;border-radius:50%;--vs:48px}
.ti .dgr{display:none}
.pvd{--vs:150px;width:150px;overflow:hidden;background:none}
.sty i.ti{width:48px;height:48px}
.armbase{background:#0000000d;box-shadow:inset 0 0 0 1px #ffffff30,0 .6cqw 2cqw #0002}
.arm{background:linear-gradient(90deg,#f4f4f4,#8c8c8c)}
.arm::before,.arm::after{background:#1b1b1b}
.playing .arm{transform:rotate(var(--ang,14deg))}
.lyr{left:2cqw;width:46cqw;top:calc(50% + 23cqw);transform:translateY(-100%);height:13cqw;border-radius:0 0 1.2cqw 1.2cqw}
.lyi{left:3cqw;right:7cqw}
.lyi div{font-size:max(11px,1.75cqw)}
@media(orientation:portrait){
.lyr{left:3cqw;width:58cqw;top:60cqw;height:18cqw}
.lyi{left:3cqw;right:3cqw}.lyi div{font-size:max(11px,3.1cqw)}
}
.tabs2{display:flex;gap:4px;margin:10px 0}
.tabs2 button{flex:1;padding:8px 2px;border-radius:10px;font-size:.85rem;background:var(--sf2)}
.tabs2 button.on{background:var(--tx);color:var(--on)}
.tp{display:none}.tp.on{display:block}
.swb{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px #0003}
.swb.on{border-color:var(--tx)}
dialog .sw .swi{display:inline-block;width:34px!important;height:34px;margin:0!important;padding:0!important;border:0;background:none}
</style></head>
<body>
<div class="home" id="home">
 <header class="hh"><h1>Mi música</h1><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="b" id="syncb" hidden>Sincronizar con GitHub</button><button class="b pri" id="addb" style="display:flex;gap:6px;align-items:center"></button></div></header>
 <input type="file" id="file" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg" multiple hidden>
 <div id="homebody"></div>
</div>
<div class="home" id="dv" hidden><div id="dvb"></div></div>
<div class="mini" id="mini" hidden></div>
<div class="app" id="pv" hidden>
 <section class="player" id="pl">
  <div class="ptop"><button class="chip" id="back"></button><span style="flex:1"></span><button class="ib" id="lyb" title="Letra"></button><button class="ib" id="qb" title="Fila de reproducción"></button></div>
  <div class="stage">
   <div class="cover" id="cover"></div>
   <div class="lyr" id="lyr" hidden></div>
   <div class="vwrap"><div class="disc"><div class="label" id="label"><div class="lt"><b id="lt1"></b><span id="lt2"></span></div></div></div><div class="armbase"><div class="arm"></div></div></div>
  </div>
  <div class="info"><div><b id="ttl">Sin reproducción</b><span id="art">Carga tu música para empezar</span></div><button class="ib" id="mre" data-i="more" title="Menú" style="width:38px;height:38px;display:none"></button></div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="ctl">
   <button class="ib" id="shuf" data-i="shuffle" title="Aleatorio"></button>
   <button class="ib" id="prev" data-i="prev" title="Anterior"></button>
   <button class="ib play" id="pp" data-i="play" title="Reproducir"></button>
   <button class="ib" id="next" data-i="next" title="Siguiente"></button>
   <button class="ib" id="rep" data-i="repeat" title="Repetir"></button>
  </div>
  <div class="vol"><span data-i="vol"></span><input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div>
 </section>
 <div id="qbk"></div><section class="qs" id="qs"><div class="qh"><span>A continuación <span id="qn" style="color:var(--mu);font-weight:400;font-size:.85rem"></span></span><button class="ib" id="qx" style="width:36px;height:36px"></button></div><div class="q" id="q"></div></section>
</div>
<div id="toast" hidden></div>
<dialog id="dlg"></dialog>
<audio id="au" preload="auto" playsinline></audio>

  const rem=j.tree.filter(f=>f.type==='blob'&&/^music\/.+\.(mp3|m4a|flac|wav|ogg|aac)$/i.test(f.path));
  const have=new Map(tracks.filter(t=>t.remote).map(t=>[t.name,t])),todo=rem.filter(f=>!have.has(f.path)||have.get(f.path).size!==f.size);
  let n=0,ok=0;const bad=[];
  for(const f of todo){
   b.textContent=`Descargando ${++n}/${todo.length}…`;
   try{
    const u=f.path.split('/').map(encodeURIComponent).join('/'),h=have.get(f.path);
    let res=await fetch(u,{cache:'no-store'});
    if(!res.ok)res=await fetch(`https://raw.githubusercontent.com/${o}/${r}/HEAD/${u}`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const blob=await res.blob(),p=f.path.split('/'),m=await meta(blob,p[p.length-1]);
    if(!m.album&&p.length>2)m.album=p[p.length-2];
    const rec={...m,blob,name:f.path,size:f.size,remote:1};if(h)rec.id=h.id;
    if(await put('tracks',rec)==null)throw new Error('no se pudo guardar ('+(window._ierr||'?')+')');
    ok++;
   }catch(e){bad.push(f.path+' → '+(e.message||e))}
  }
  const lr=new Map(j.tree.filter(f=>f.type==='blob'&&/^music\/.+\.lrc$/i.test(f.path)).map(f=>[f.path.replace(/\.lrc$/i,'').toLowerCase(),f]));
  tracks=await all('tracks');
  for(const t of tracks.filter(t=>t.remote)){const f=lr.get(t.name.replace(/\.[^.]+$/,'').toLowerCase());if(!f)continue;const o=aset['ly:'+t.id];if(o&&o.sha===f.sha)continue;
   try{const res=await fetch(f.path.split('/').map(encodeURIComponent).join('/'),{cache:'no-store'});if(!res.ok)continue;const text=await res.text();aset['ly:'+t.id]={name:'ly:'+t.id,text,sha:f.sha};await put('albums',aset['ly:'+t.id])}catch(e){}}
  for(const t of tracks.filter(t=>t.remote&&!rem.some(f=>f.path===t.name)))await del('tracks',t.id);
  tracks=await all('tracks');await fillCovers();refresh();b.textContent=bad.length?ok+' nuevas, '+bad.length+' con error':ok?'Listo, '+ok+(ok>1?' nuevas':' nueva'):'Todo al día';
  if(bad.length)alert('No se pudo descargar:\n'+bad.slice(0,3).join('\n'));
 }catch(e){b.textContent='Sin conexión o repositorio no encontrado'}
 setTimeout(()=>b.textContent=lab,3000)}
